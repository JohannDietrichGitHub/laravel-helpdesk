name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Application checks
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: helpdesk
      DB_USERNAME: helpdesk
      DB_PASSWORD: helpdesk

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: helpdesk
          MYSQL_USER: helpdesk
          MYSQL_PASSWORD: helpdesk
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, fileinfo, mysql
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Setup Application
        run: composer setup

      - name: Audit Composer dependencies
        if: ${{ !cancelled() }}
        run: composer audit --no-interaction

      - name: Audit npm dependencies
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high

      - name: Verify migrations against MySQL
        if: ${{ !cancelled() }}
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: helpdesk
          DB_USERNAME: helpdesk
          DB_PASSWORD: helpdesk
        run: php artisan migrate:fresh --force

      - name: Run Pint
        if: ${{ !cancelled() }}
        run: composer lint:check

      - name: Run PHPStan
        if: ${{ !cancelled() }}
        run: php -d memory_limit=512M vendor/bin/phpstan analyse

      - name: Run TypeScript checks
        if: ${{ !cancelled() }}
        run: npm run types:check

      - name: Run frontend checks
        if: ${{ !cancelled() }}
        run: npm run check

      - name: Run feature tests
        if: ${{ !cancelled() }}
        run: php artisan test --testsuite Feature

      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: php artisan test --testsuite Unit

  docker:
    name: Docker image build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build application image
        run: docker build --target app --tag helpdesk:ci .

      - name: Scan application image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.69.0 image
          --exit-code 1
          --severity HIGH,CRITICAL
          helpdesk:ci

  e2e:
    name: Docker Compose E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Docker Compose stack
        run: |
          cp .env.example .env
          docker compose up --build --detach --wait --wait-timeout 120

      - name: Seed demo data
        run: docker compose exec --no-TTY app php artisan db:seed --force

      - name: Wait for HTTP service
        run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.58.2
          npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run Playwright E2E tests
        run: npx playwright test --project=chromium
        working-directory: e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop Docker Compose stack
        if: ${{ !cancelled() }}
        run: docker compose down --volumes
