name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, fileinfo, mysql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install npm dependencies
        run: npm ci

      - name: Audit Composer dependencies
        run: composer audit --no-interaction

      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high

  migrations:
    name: Migration verification
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: helpdesk
      DB_USERNAME: helpdesk
      DB_PASSWORD: helpdesk
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: helpdesk
          MYSQL_USER: helpdesk
          MYSQL_PASSWORD: helpdesk
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, fileinfo, mysql
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate --force && php artisan migrate:fresh --force

  lint:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint:check

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php -d memory_limit=512M vendor/bin/phpstan analyse

  typescript:
    name: TypeScript checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, fileinfo
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate --force && php artisan wayfinder:generate --with-form --no-interaction
      - run: npm ci
      - run: npm run types:check

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, fileinfo
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate --force && php artisan wayfinder:generate --with-form --no-interaction
      - run: npm ci
      - run: npm run check

  feature-tests:
    name: Feature tests
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: helpdesk
      DB_USERNAME: helpdesk
      DB_PASSWORD: helpdesk
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: helpdesk
          MYSQL_USER: helpdesk
          MYSQL_PASSWORD: helpdesk
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, fileinfo, mysql
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate --force && php artisan wayfinder:generate --with-form --no-interaction
      - run: npm ci
      - run: npm run build
      - run: php artisan test --testsuite Feature

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate --force && php artisan test --testsuite Unit

  docker:
    name: Docker image build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build application image
        run: docker build --target app --tag helpdesk:ci .

      - name: Scan application image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.69.0 image
          --exit-code 1
          --severity HIGH,CRITICAL
          helpdesk:ci

  e2e:
    name: Docker Compose E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Docker Compose stack
        run: |
          cp .env.example .env
          php -r '$key = base64_encode(random_bytes(32)); $env = file_get_contents(".env"); $env = preg_replace("/^APP_KEY=.*$/m", "APP_KEY=base64:$key", $env); file_put_contents(".env", $env);'
          docker compose up --build --detach --wait --wait-timeout 120

      - name: Seed demo data
        run: docker compose exec --no-TTY app php artisan db:seed --force

      - name: Wait for HTTP service
        run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.58.2
          npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run Playwright E2E tests
        run: npx playwright test --project=chromium
        working-directory: e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop Docker Compose stack
        if: ${{ !cancelled() }}
        run: docker compose down
